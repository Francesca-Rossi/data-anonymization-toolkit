<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonimizzatore Dati Excel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Libreria SheetJS per la lettura e scrittura di file Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Libreria CryptoJS per la cifratura reversibile -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar per la lista delle colonne */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <div class="max-w-3xl w-full bg-white rounded-2xl shadow-xl p-8 relative">
        
        <!-- Language Switcher -->
        <div class="absolute top-6 right-8 flex space-x-2">
            <button id="lang-it" class="text-sm font-bold text-blue-600 underline">IT</button>
            <span class="text-gray-300">|</span>
            <button id="lang-en" class="text-sm font-medium text-gray-500 hover:text-blue-600 transition-colors">EN</button>
        </div>

        <!-- Header -->
        <div class="text-center mb-6 mt-4">
            <h1 class="text-3xl font-bold text-gray-800 mb-2" data-i18n="title">Anonimizzatore Dati Excel</h1>
            <p class="text-gray-500 text-sm" data-i18n="subtitle">Nessuna AI. Nessun server. I dati rimangono nel tuo browser.</p>
        </div>

        <!-- Mode Toggle -->
        <div class="flex justify-center space-x-2 mb-8 bg-gray-100 p-1 rounded-lg max-w-sm mx-auto">
            <button id="tab-anon" class="flex-1 py-2 px-4 rounded-md bg-white shadow text-sm font-semibold text-blue-600 transition-all" data-i18n="tabAnon">Anonimizza</button>
            <button id="tab-deanon" class="flex-1 py-2 px-4 rounded-md text-sm font-semibold text-gray-500 hover:text-gray-700 transition-all" data-i18n="tabDeanon">De-anonimizza</button>
        </div>

        <!-- Step 1: Upload File -->
        <div id="step-1" class="mb-8">
            <label id="step-1-label" class="block text-sm font-medium text-gray-700 mb-2" data-i18n="step1Anon">1. Carica il tuo file Excel originale (.xlsx, .xls)</label>
            <div class="flex items-center justify-center w-full">
                <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 border-blue-300 transition-colors">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-10 h-10 mb-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <p class="mb-2 text-sm text-gray-500">
                            <span class="font-semibold" data-i18n="uploadText">Clicca per caricare</span><span data-i18n="uploadOr"> o trascina il file qui</span>
                        </p>
                        <p class="text-xs text-gray-500" id="file-name-display" data-i18n="noFile">Nessun file selezionato</p>
                    </div>
                    <input id="dropzone-file" type="file" class="hidden" accept=".xlsx, .xls, .csv" />
                </label>
            </div>
        </div>

        <!-- Step 2: Configuration (Hidden initially) -->
        <div id="step-2" class="hidden opacity-0 transition-opacity duration-500">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <!-- Selettore Colonne -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="step2Title">2. Seleziona colonne da elaborare</label>
                    <div class="border border-gray-200 rounded-lg p-3 h-48 overflow-y-auto custom-scrollbar bg-gray-50" id="columns-container">
                        <!-- Le checkbox delle colonne verranno iniettate qui via JS -->
                    </div>
                </div>

                <!-- Impostazioni di Anonimizzazione -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2" data-i18n="step3Title">3. Metodo di elaborazione</label>
                    <div id="methods-container" class="space-y-3 bg-gray-50 p-4 rounded-lg border border-gray-200">
                        <label class="flex items-start">
                            <input type="radio" name="anon-method" value="mask-full" class="mt-1 text-blue-600 focus:ring-blue-500" checked>
                            <span class="ml-2">
                                <span class="block text-sm font-medium text-gray-800" data-i18n="methodFull">Oscuramento Totale</span>
                                <span class="block text-xs text-gray-500" data-i18n="methodFullDesc">Sostituisce tutto con "***" (es. Mario -> ***)</span>
                            </span>
                        </label>
                        <label class="flex items-start">
                            <input type="radio" name="anon-method" value="mask-partial" class="mt-1 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2">
                                <span class="block text-sm font-medium text-gray-800" data-i18n="methodPartial">Oscuramento Parziale</span>
                                <span class="block text-xs text-gray-500" data-i18n="methodPartialDesc">Mantiene prima e ultima lettera (es. Mario -> M***o)</span>
                            </span>
                        </label>
                        <label class="flex items-start">
                            <input type="radio" name="anon-method" value="random-id" class="mt-1 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2">
                                <span class="block text-sm font-medium text-gray-800" data-i18n="methodRandom">ID Casuale</span>
                                <span class="block text-xs text-gray-500" data-i18n="methodRandomDesc">Sostituisce con un codice unico (es. Mario -> ID-X7B9A)</span>
                            </span>
                        </label>
                        <label class="flex items-start">
                            <input type="radio" name="anon-method" value="encrypt" class="mt-1 text-blue-600 focus:ring-blue-500">
                            <span class="ml-2">
                                <span class="block text-sm font-medium text-gray-800" data-i18n="methodEncrypt">Cifratura Reversibile (AES)</span>
                                <span class="block text-xs text-gray-500" data-i18n="methodEncryptDesc">Usa una password. Potrai ripristinarli de-anonimizzando.</span>
                            </span>
                        </label>
                    </div>
                    
                    <!-- Password Container -->
                    <div id="password-container" class="hidden mt-4 bg-blue-50 p-4 rounded-lg border border-blue-100">
                        <label class="block text-sm font-medium text-blue-800 mb-1" data-i18n="pwdLabel">Password di Sicurezza</label>
                        <input type="password" id="crypto-password" data-i18n-placeholder="pwdPlaceholder" class="w-full border border-blue-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Inserisci password...">
                        <p class="text-xs text-blue-600 mt-1" data-i18n="pwdDesc">Memorizza la password, ti servirà per decifrare i dati!</p>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <button id="process-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition-colors flex justify-center items-center mb-6">
                <span data-i18n="btnPreviewAnon">Genera Anteprima</span>
            </button>

            <!-- Preview Section -->
            <div id="preview-section" class="hidden flex-col gap-4">
                <h3 class="text-lg font-semibold text-gray-800 border-b pb-2" data-i18n="previewTitle">Anteprima Dati (Prime righe)</h3>
                <div class="overflow-x-auto border border-gray-200 rounded-lg bg-white custom-scrollbar max-h-64">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0" id="preview-thead">
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200" id="preview-tbody">
                        </tbody>
                    </table>
                </div>
                <button id="download-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md transition-colors flex justify-center items-center mt-2">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span data-i18n="btnDownloadAnon">Scarica File Anonimizzato</span>
                </button>
            </div>

        </div>

    </div>

    <script>
        // === GESTIONE LINGUE ===
        let currentLang = 'it';
        const translations = {
            it: {
                title: "Anonimizzatore Dati Excel",
                subtitle: "Nessuna AI. Nessun server. I dati rimangono nel tuo browser.",
                tabAnon: "Anonimizza",
                tabDeanon: "De-anonimizza",
                step1Anon: "1. Carica il tuo file Excel originale (.xlsx, .xls)",
                step1Deanon: "1. Carica il file anonimizzato da decifrare (.xlsx, .xls)",
                uploadText: "Clicca per caricare",
                uploadOr: " o trascina il file qui",
                noFile: "Nessun file selezionato",
                step2Title: "2. Seleziona colonne da elaborare",
                step3Title: "3. Metodo di elaborazione",
                methodFull: "Oscuramento Totale",
                methodFullDesc: "Sostituisce tutto con \"***\" (es. Mario -> ***)",
                methodPartial: "Oscuramento Parziale",
                methodPartialDesc: "Mantiene prima e ultima lettera (es. Mario -> M***o)",
                methodRandom: "ID Casuale",
                methodRandomDesc: "Sostituisce con un codice unico (es. Mario -> ID-X7B9A)",
                methodEncrypt: "Cifratura Reversibile (AES)",
                methodEncryptDesc: "Usa una password. Potrai ripristinarli de-anonimizzando.",
                pwdLabel: "Password di Sicurezza",
                pwdPlaceholder: "Inserisci password...",
                pwdDesc: "Memorizza la password, ti servirà per decifrare i dati!",
                btnPreviewAnon: "Genera Anteprima",
                btnPreviewDeanon: "De-anonimizza e Genera Anteprima",
                previewTitle: "Anteprima Dati (Prime righe)",
                btnDownloadAnon: "Scarica File Anonimizzato",
                btnDownloadDeanon: "Scarica file con dati in chiaro",
                alertEmpty: "Il file Excel sembra essere vuoto.",
                alertError: "Si è verificato un errore durante la lettura del file. Assicurati che sia un formato Excel valido.",
                noCols: "Nessuna colonna trovata.",
                alertSelectCol: "Per favore, seleziona almeno una colonna da elaborare.",
                alertPwd: "Inserisci la password di sicurezza per procedere.",
                moreRows: "... altre {n} righe omesse nell'anteprima ...",
                suffixAnon: "_anonimizzato",
                suffixDeanon: "_ripristinato",
                errPwd: "⚠️ ERRORE_PASSWORD",
                errDec: "⚠️ ERRORE_DECODIFICA"
            },
            en: {
                title: "Excel Data Anonymizer",
                subtitle: "No AI. No servers. Data stays in your browser.",
                tabAnon: "Anonymize",
                tabDeanon: "De-anonymize",
                step1Anon: "1. Upload your original Excel file (.xlsx, .xls)",
                step1Deanon: "1. Upload the anonymized file to decrypt (.xlsx, .xls)",
                uploadText: "Click to upload",
                uploadOr: " or drag and drop here",
                noFile: "No file selected",
                step2Title: "2. Select columns to process",
                step3Title: "3. Processing method",
                methodFull: "Full Masking",
                methodFullDesc: "Replaces everything with \"***\" (e.g. John -> ***)",
                methodPartial: "Partial Masking",
                methodPartialDesc: "Keeps first and last letter (e.g. John -> J**n)",
                methodRandom: "Random ID",
                methodRandomDesc: "Replaces with a unique ID (e.g. John -> ID-X7B9A)",
                methodEncrypt: "Reversible Encryption (AES)",
                methodEncryptDesc: "Uses a password. You can restore them by de-anonymizing.",
                pwdLabel: "Security Password",
                pwdPlaceholder: "Enter password...",
                pwdDesc: "Remember the password, you'll need it to decrypt the data!",
                btnPreviewAnon: "Generate Preview",
                btnPreviewDeanon: "De-anonymize and Preview",
                previewTitle: "Data Preview (First rows)",
                btnDownloadAnon: "Download Anonymized File",
                btnDownloadDeanon: "Download Clear Data File",
                alertEmpty: "The Excel file seems to be empty.",
                alertError: "An error occurred while reading the file. Make sure it is a valid Excel format.",
                noCols: "No columns found.",
                alertSelectCol: "Please select at least one column to process.",
                alertPwd: "Enter the security password to proceed.",
                moreRows: "... {n} more rows omitted in preview ...",
                suffixAnon: "_anonymized",
                suffixDeanon: "_restored",
                errPwd: "⚠️ PASSWORD_ERROR",
                errDec: "⚠️ DECODING_ERROR"
            }
        };

        const langItBtn = document.getElementById('lang-it');
        const langEnBtn = document.getElementById('lang-en');

        function setLanguage(lang) {
            currentLang = lang;
            
            // Stili bottoni lingua
            if (lang === 'it') {
                langItBtn.classList.add('text-blue-600', 'underline', 'font-bold');
                langItBtn.classList.remove('text-gray-500', 'font-medium');
                langEnBtn.classList.remove('text-blue-600', 'underline', 'font-bold');
                langEnBtn.classList.add('text-gray-500', 'font-medium');
            } else {
                langEnBtn.classList.add('text-blue-600', 'underline', 'font-bold');
                langEnBtn.classList.remove('text-gray-500', 'font-medium');
                langItBtn.classList.remove('text-blue-600', 'underline', 'font-bold');
                langItBtn.classList.add('text-gray-500', 'font-medium');
            }
            
            // Aggiorna elementi con data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key];
                }
            });
            
            // Aggiorna placeholder
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[currentLang][key]) {
                    el.placeholder = translations[currentLang][key];
                }
            });

            // Aggiorna nome file mostrato
            if (!fileInput.files[0]) {
                document.getElementById('file-name-display').textContent = translations[currentLang].noFile;
            }

            // Aggiorna testo riga dinamica di anteprima
            const trMore = document.getElementById('tr-more-rows');
            if (trMore && globalProcessedData && globalProcessedData.length > 10) {
                trMore.textContent = translations[currentLang].moreRows.replace('{n}', globalProcessedData.length - 10);
            }
        }

        langItBtn.addEventListener('click', () => setLanguage('it'));
        langEnBtn.addEventListener('click', () => setLanguage('en'));

        // === LOGICA APPLICAZIONE ===
        let currentWorkbook = null;
        let currentSheetName = null;
        let excelData = [];
        let headers = [];
        let globalProcessedData = null; 
        let currentMode = 'anon'; 

        const fileInput = document.getElementById('dropzone-file');
        const fileNameDisplay = document.getElementById('file-name-display');
        const step2 = document.getElementById('step-2');
        const columnsContainer = document.getElementById('columns-container');
        const processBtn = document.getElementById('process-btn');
        const previewSection = document.getElementById('preview-section');
        const previewThead = document.getElementById('preview-thead');
        const previewTbody = document.getElementById('preview-tbody');
        const downloadBtn = document.getElementById('download-btn');

        const tabAnon = document.getElementById('tab-anon');
        const tabDeanon = document.getElementById('tab-deanon');
        const methodsContainer = document.getElementById('methods-container');
        const passwordContainer = document.getElementById('password-container');
        const cryptoPassword = document.getElementById('crypto-password');
        const processBtnText = processBtn.querySelector('span');
        const step1Label = document.getElementById('step-1-label');
        const downloadBtnText = document.querySelector('#download-btn span');
        
        // Gestione Tab
        tabAnon.addEventListener('click', () => {
            currentMode = 'anon';
            tabAnon.classList.add('bg-white', 'shadow', 'text-blue-600');
            tabAnon.classList.remove('text-gray-500');
            tabDeanon.classList.remove('bg-white', 'shadow', 'text-blue-600');
            tabDeanon.classList.add('text-gray-500');
            
            methodsContainer.classList.remove('hidden');
            
            // Aggiorna chiavi i18n in base alla modalità
            step1Label.setAttribute('data-i18n', 'step1Anon');
            processBtnText.setAttribute('data-i18n', 'btnPreviewAnon');
            downloadBtnText.setAttribute('data-i18n', 'btnDownloadAnon');
            setLanguage(currentLang); // Applica traduzione
            
            const selectedMethod = document.querySelector('input[name="anon-method"]:checked').value;
            if(selectedMethod === 'encrypt') passwordContainer.classList.remove('hidden');
            else passwordContainer.classList.add('hidden');
        });

        tabDeanon.addEventListener('click', () => {
            currentMode = 'deanon';
            tabDeanon.classList.add('bg-white', 'shadow', 'text-blue-600');
            tabDeanon.classList.remove('text-gray-500');
            tabAnon.classList.remove('bg-white', 'shadow', 'text-blue-600');
            tabAnon.classList.add('text-gray-500');
            
            methodsContainer.classList.add('hidden');
            passwordContainer.classList.remove('hidden');
            
            // Aggiorna chiavi i18n in base alla modalità
            step1Label.setAttribute('data-i18n', 'step1Deanon');
            processBtnText.setAttribute('data-i18n', 'btnPreviewDeanon');
            downloadBtnText.setAttribute('data-i18n', 'btnDownloadDeanon');
            setLanguage(currentLang); // Applica traduzione
        });

        // Gestione Metodi
        document.querySelectorAll('input[name="anon-method"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if(e.target.value === 'encrypt') {
                    passwordContainer.classList.remove('hidden');
                } else {
                    passwordContainer.classList.add('hidden');
                }
            });
        });

        // Caricamento file
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileNameDisplay.textContent = file.name;
            fileNameDisplay.classList.add('text-blue-600', 'font-medium');

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = evt.target.result;
                try {
                    currentWorkbook = XLSX.read(data, { type: 'array' });
                    currentSheetName = currentWorkbook.SheetNames[0]; 
                    const worksheet = currentWorkbook.Sheets[currentSheetName];
                    const jsonRaw = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    
                    if (jsonRaw.length === 0) {
                        alert(translations[currentLang].alertEmpty);
                        return;
                    }

                    headers = jsonRaw[0];
                    excelData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    renderColumns(headers);

                    step2.classList.remove('hidden');
                    setTimeout(() => step2.classList.remove('opacity-0'), 50);

                } catch (error) {
                    console.error(error);
                    alert(translations[currentLang].alertError);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Render Colonne
        function renderColumns(columns) {
            columnsContainer.innerHTML = ''; 

            if (!columns || columns.length === 0) {
                columnsContainer.innerHTML = `<p class="text-sm text-gray-500 p-2">${translations[currentLang].noCols}</p>`;
                return;
            }

            columns.forEach((col, index) => {
                const colName = col ? col : `Colonna ${index + 1}`;
                const label = document.createElement('label');
                label.className = "flex items-center p-2 hover:bg-gray-100 rounded cursor-pointer transition-colors";
                
                const input = document.createElement('input');
                input.type = "checkbox";
                input.value = colName;
                input.className = "w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 column-checkbox";
                
                const span = document.createElement('span');
                span.className = "ml-3 text-sm font-medium text-gray-700 truncate";
                span.textContent = colName;
                span.title = colName; 

                label.appendChild(input);
                label.appendChild(span);
                columnsContainer.appendChild(label);
            });
        }

        function anonymizeValue(value, method, password) {
            if (value === null || value === undefined || value === "") return value;
            const strValue = String(value);
            
            switch (method) {
                case 'mask-full':
                    return "***";
                case 'mask-partial':
                    if (strValue.length <= 2) return "***";
                    return strValue.charAt(0) + "***" + strValue.charAt(strValue.length - 1);
                case 'random-id':
                    return "ID-" + Math.random().toString(36).substring(2, 8).toUpperCase();
                case 'encrypt':
                    return "ENC::" + CryptoJS.AES.encrypt(strValue, password).toString();
                default:
                    return "***";
            }
        }

        function deanonymizeValue(value, password) {
            if (value === null || value === undefined || value === "") return value;
            const strValue = String(value);
            if (strValue.startsWith("ENC::")) {
                try {
                    const encryptedStr = strValue.substring(5);
                    const bytes = CryptoJS.AES.decrypt(encryptedStr, password);
                    const decryptedText = bytes.toString(CryptoJS.enc.Utf8);
                    if (!decryptedText) return translations[currentLang].errPwd;
                    return decryptedText;
                } catch (e) {
                    return translations[currentLang].errDec;
                }
            }
            return value; 
        }

        // Pulsante Processa
        processBtn.addEventListener('click', function() {
            const checkboxes = document.querySelectorAll('.column-checkbox:checked');
            const selectedColumns = Array.from(checkboxes).map(cb => cb.value);

            if (selectedColumns.length === 0) {
                alert(translations[currentLang].alertSelectCol);
                return;
            }

            const method = currentMode === 'anon' ? document.querySelector('input[name="anon-method"]:checked').value : null;
            const password = cryptoPassword.value;

            if ((currentMode === 'deanon' || method === 'encrypt') && !password) {
                alert(translations[currentLang].alertPwd);
                return;
            }

            globalProcessedData = JSON.parse(JSON.stringify(excelData));

            globalProcessedData.forEach(row => {
                selectedColumns.forEach(col => {
                    if (row.hasOwnProperty(col)) {
                        if (currentMode === 'anon') {
                            row[col] = anonymizeValue(row[col], method, password);
                        } else {
                            row[col] = deanonymizeValue(row[col], password);
                        }
                    }
                });
            });

            renderPreview(globalProcessedData, headers);
            previewSection.classList.remove('hidden');
            previewSection.classList.add('flex');
        });

        // Anteprima
        function renderPreview(data, cols) {
            previewThead.innerHTML = '';
            previewTbody.innerHTML = '';

            const trHead = document.createElement('tr');
            cols.forEach(col => {
                const th = document.createElement('th');
                th.className = "px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider";
                th.textContent = col || '-';
                trHead.appendChild(th);
            });
            previewThead.appendChild(trHead);

            const previewLimit = Math.min(data.length, 10);
            for (let i = 0; i < previewLimit; i++) {
                const row = data[i];
                const tr = document.createElement('tr');
                
                cols.forEach(col => {
                    const td = document.createElement('td');
                    td.className = "px-6 py-4 whitespace-nowrap text-sm text-gray-700";
                    td.textContent = row.hasOwnProperty(col) ? row[col] : '';
                    tr.appendChild(td);
                });
                
                previewTbody.appendChild(tr);
            }
            
            if(data.length > 10) {
                 const trMore = document.createElement('tr');
                 const tdMore = document.createElement('td');
                 tdMore.id = "tr-more-rows";
                 tdMore.colSpan = cols.length;
                 tdMore.className = "px-6 py-3 text-center text-sm text-gray-400 italic bg-gray-50";
                 tdMore.textContent = translations[currentLang].moreRows.replace('{n}', data.length - 10);
                 trMore.appendChild(tdMore);
                 previewTbody.appendChild(trMore);
            }
        }

        // Download
        downloadBtn.addEventListener('click', function() {
            if (!globalProcessedData) return;

            const newWorksheet = XLSX.utils.json_to_sheet(globalProcessedData);
            const newWorkbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, currentSheetName);

            const originalName = fileInput.files[0].name;
            const extIndex = originalName.lastIndexOf('.');
            const baseName = extIndex !== -1 ? originalName.substring(0, extIndex) : originalName;
            const ext = extIndex !== -1 ? originalName.substring(extIndex) : '.xlsx';
            
            const suffix = currentMode === 'anon' ? translations[currentLang].suffixAnon : translations[currentLang].suffixDeanon;
            const newFileName = `${baseName}${suffix}${ext}`;

            XLSX.writeFile(newWorkbook, newFileName);
        });

        // Inizializza lingua
        setLanguage('it');

    </script>
</body>
</html>
